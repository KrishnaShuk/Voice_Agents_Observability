services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vox
      POSTGRES_PASSWORD: vox
      POSTGRES_DB: vox_observability
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vox -d vox_observability"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
